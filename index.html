<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vertex-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vertex — codebase intelligence. See your architecture, dependencies, and technical debt as a living system."
    />
    <title>Vertex — Codebase Intelligence</title>
    <script>
      // Apply persisted theme before first paint (defaults to dark).
      (function () {
        try {
          var t = localStorage.getItem("vertex-theme");
          document.documentElement.dataset.theme =
            t === "light" || t === "dark" ? t : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
